name: 임상미생물 브리핑 자동화 (v8.0)

on:
  schedule:
    # 매주 목요일 오후 7시 (KST = UTC+9 -> UTC 10:00) 자동 수집 (표본감시 주간소식지 발행 이후)
    - cron: '0 10 * * 4'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행할 작업을 선택하세요'
        required: true
        default: 'collect'
        type: choice
        options:
          - collect
          - resummarize_all
          - sync_sheet_only
          - test_apis
      force_resummarize:
        description: 'resummarize_all 실행 시 이미 완료된 항목도 처음부터 다시 요약할까요?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 환경 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 패키지 설치
        run: pip install -r requirements.txt

      - name: 임상미생물 수집·요약·대시보드 데이터 빌드 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KDCA_API_KEY: ${{ secrets.KDCA_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          MODE="${{ github.event.inputs.mode || 'collect' }}"
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_resummarize }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/pipeline.py --mode "$MODE" $FORCE_FLAG

      - name: 최신 대시보드 데이터(docs/data/dashboard.json) 자동 반영
        run: |
          git config user.name "ClinicalMicro Bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/dashboard.json
          if git diff --staged --quiet; then
            echo "대시보드 데이터 변경 사항 없음"
          else
            git commit -m "chore: update clinical microbiology dashboard data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
